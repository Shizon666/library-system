server:
  port: 8081

spring:
  application:
    name: library-management-system
  datasource:
    url: jdbc:mysql://localhost:3306/library?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.library.entity
  configuration:
    map-underscore-to-camel-case: false
    call-setters-on-nulls: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

library:
  borrow-days: 30
  fine-per-day: 1.00
  max-unpaid-fine: 50.00
  undergrad-borrow-limit: 5
  grad-borrow-limit: 10
